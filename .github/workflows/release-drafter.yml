name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    permissions:
      # Create and update the draft release
      contents: write
      # Read merged PRs for the notes; write is only needed for the autolabeler, which is not configured
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7  # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
